[project]
name = "auto-hugr-ext"
version = "0.1.0"
requires-python = ">=3.12,<4"
description = "Automatic Hugr extension generation."
readme = "README.md"

dependencies = [
    "guppylang",
    "guppylang-internals",
    "hugr~=0.18.6",
]

[project.scripts]
auto-hugr-ext = "auto_hugr_ext.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auto_hugr_ext"]
